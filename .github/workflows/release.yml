name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: Build totp.exe with PyInstaller
        run: |
          pyinstaller --onefile --name totp --clean --console --noconfirm --paths src src/totp_cli/__main__.py

      - name: Verify totp.exe (--version)
        run: dist\totp.exe --version

      - name: Verify totp.exe (--help)
        run: dist\totp.exe --help

      - name: Verify totp.exe (init smoke test)
        run: dist\totp.exe init --key "$env:RUNNER_TEMP\totp-smoke-test.key"

      - name: Upload totp.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: totp-exe
          path: dist/totp.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download totp.exe artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: totp-exe
          path: dist

      - name: Upload totp.exe to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/totp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
