name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[build]"

      - name: Build vtotp.exe with Nuitka
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --output-dir=dist --output-filename=vtotp --include-package=vtotp --include-package=cryptography src/vtotp/__main__.py

      - name: Verify vtotp.exe (--version)
        run: dist\vtotp.exe --version

      - name: Verify vtotp.exe (--help)
        run: dist\vtotp.exe --help

      - name: Verify vtotp.exe (init smoke test)
        run: dist\vtotp.exe init --key "$env:RUNNER_TEMP\vtotp-smoke-test.key"

      - name: Upload vtotp.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vtotp-exe
          path: dist/vtotp.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download vtotp.exe artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vtotp-exe
          path: dist

      - name: Upload vtotp.exe to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/vtotp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
